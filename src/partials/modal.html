<div class = 'backdrop'>

        <button class ="modal_close_button">
        <img src ='./img/close-icon.png' />
    </button>
    <pre class ="modal_text">Привіт!
Ви потрапили на сайт інтерактивних ігор та завдань

        <li class ="modal_icon_item icon-sword"><img src="./img/sword.svg" /></li>

    </div>
</div>
